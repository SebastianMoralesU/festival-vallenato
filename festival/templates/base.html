{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Festival Vallenato{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>

    <link href="{% static 'css/estilos.css' %}" rel="stylesheet">
    <script src="{% static 'js/login.js' %}"></script>
</head>

<body class="body-base">

<nav class="navbar-base">
    <div class="container-fluid justify-content-center">
        <a class="navbar-brand" href="#">
            <img src="{% static 'img/logo-2.png' %}"
                 alt="Logo"
                 width="290"
                 height="90"
                 class="d-inline-block align-text-top">
        </a>
    </div>
</nav>

<br>

<div class="container">
    {% block atras %}
    {% endblock %}
</div>

<div class="container mt-4">
    {% block contenido %}
    {% endblock %}
</div>

</body>
</html>
